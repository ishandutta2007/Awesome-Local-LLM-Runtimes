<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#10172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <style>
      .orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .signal-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .floating-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .floating-pill-rev {
        animation: floatPillRev 7s ease-in-out infinite alternate;
      }
      @keyframes pulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
        100% { transform: translate(60px, 30px) scale(1.25); opacity: 0.75; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        100% { transform: translate(-50px, -20px) scale(1.3); opacity: 0.7; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -400; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes floatPillRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Animated Glowing Orbs -->
  <g filter="url(#blur-glow)">
    <circle class="orb-1" cx="220" cy="140" r="160" fill="url(#glow-grad-cyan)" />
    <circle class="orb-2" cx="980" cy="270" r="190" fill="url(#glow-grad-purple)" />
  </g>

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Decorative Network / Circuit Lines -->
  <g class="signal-line" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.5">
    <path d="M 60 110 L 260 110 L 320 180 L 880 180 L 940 110 L 1140 110" />
    <path d="M 120 310 L 380 310 L 440 240 L 760 240 L 820 310 L 1080 310" />
  </g>

  <!-- Title & Subtitle in Foreground -->
  <g id="foreground-text">
    <!-- Super-header Category Badge -->
    <g transform="translate(470, 48)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="28" y="19.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">CURATED RUNTIMES DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome Local LLM Runtimes
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      High-Performance Inference Engines, Local API Servers &amp; On-Device Stacks
    </text>

    <!-- Tagline / Value Proposition -->
    <text x="600" y="206" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      ⚡ Low Latency &bull; 🔒 100% Data Privacy &bull; 💸 Zero Cloud Token Fees &bull; 🌐 OpenAI-Compatible APIs
    </text>
  </g>

  <!-- Interactive Dynamic Showcase Feature Pills (Lower Deck) -->
  <g transform="translate(100, 260)">
    <!-- Pill 1: Ollama -->
    <g class="floating-pill" transform="translate(0, 0)">
      <rect width="180" height="74" rx="12" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
      <text x="18" y="32" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">🦙 Ollama</text>
      <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11.5">One-command CLI &amp; API</text>
    </g>

    <!-- Pill 2: llama.cpp -->
    <g class="floating-pill-rev" transform="translate(205, 0)">
      <rect width="180" height="74" rx="12" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
      <text x="18" y="32" fill="#818cf8" font-family="sans-serif" font-size="15" font-weight="700">⚡ llama.cpp</text>
      <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11.5">C/C++ Foundation Engine</text>
    </g>

    <!-- Pill 3: vLLM -->
    <g class="floating-pill" transform="translate(410, 0)">
      <rect width="180" height="74" rx="12" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
      <text x="18" y="32" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="700">🚀 vLLM</text>
      <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11.5">PagedAttention Serving</text>
    </g>

    <!-- Pill 4: SGLang -->
    <g class="floating-pill-rev" transform="translate(615, 0)">
      <rect width="180" height="74" rx="12" fill="url(#pill-grad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
      <text x="18" y="32" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="700">🎯 SGLang</text>
      <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11.5">RadixAttention Engine</text>
    </g>

    <!-- Pill 5: LM Studio -->
    <g class="floating-pill" transform="translate(820, 0)">
      <rect width="180" height="74" rx="12" fill="url(#pill-grad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
      <text x="18" y="32" fill="#f472b6" font-family="sans-serif" font-size="15" font-weight="700">🖥️ LM Studio</text>
      <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Desktop GUI &amp; Server</text>
    </g>
  </g>

  <!-- Modern Border Framing -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
</svg>
